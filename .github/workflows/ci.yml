name: CI / Build Validation

on:
  push:
    branches:
      - main
      - 'migration/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjpeg-dev zlib1g-dev libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Compilation Check
        run: |
          python -m compileall -q backend investigative_copilot

      - name: Validate Core API & Engines Import
        run: |
          python -c "from backend.api import app; print('[OK] FastAPI application loaded successfully')"
          python -c "from backend.risk.ensemble import ensemble_scores; print('[OK] 11-Model Risk Ensemble loaded successfully')"
          python -c "from investigative_copilot.router import router; print('[OK] Copilot Router loaded successfully')"

  frontend-validation:
    name: Frontend (Next.js 16 / Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
