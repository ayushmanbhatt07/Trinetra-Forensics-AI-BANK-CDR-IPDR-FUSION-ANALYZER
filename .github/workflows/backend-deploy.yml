name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches: [ main ]

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase repository names
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set CI commit variables
        run: |
          CI_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "CI_SHA=${CI_SHA}" >> $GITHUB_ENV
          echo "CI_SHORT_SHA=${CI_SHA::7}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Downcase repository name for GHCR
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.CI_SHORT_SHA }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          envs: GHCR_TOKEN,GHCR_USERNAME
          script: |
            # Authenticate to GHCR on the server to pull the image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            
            # Identify exact image to deploy
            NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.CI_SHORT_SHA }}"
            
            # Pull the new image
            docker pull $NEW_IMAGE
            
            # Capture the currently running image for rollback
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' trinetra-backend 2>/dev/null || echo "")
            
            # Stop and remove the existing container
            docker stop trinetra-backend || true
            docker rm trinetra-backend || true
            
            # Ensure the deployment directories and .env exist
            sudo mkdir -p /opt/trinetra/data/cases
            if [ ! -f /opt/trinetra/.env ]; then
              echo "WARNING: /opt/trinetra/.env not found, creating baseline fallback .env"
              sudo touch /opt/trinetra/.env
            fi
            
            # Ensure permissive data directory permissions for container user
            sudo chmod -R 777 /opt/trinetra/data || true
            
            # Start the new container
            docker run -d \
              --name trinetra-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /opt/trinetra/data:/app/data \
              -e APP_DATA_DIR=/app/data \
              -e APP_CASE_DIR=/app/data/cases \
              --env-file /opt/trinetra/.env \
              $NEW_IMAGE
            
            # Health check loop (wait up to 90 seconds for cold-start ML imports)
            echo "Waiting for container to start and initialize ML engines..."
            HEALTHY=false
            for i in $(seq 1 18); do
              if curl -s -f http://localhost:8000/health > /dev/null; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $i/18: waiting 5s..."
              sleep 5
            done
            
            if [ "$HEALTHY" = true ]; then
              echo "Deployment successful! Container is healthy and responding."
              docker ps --filter "name=trinetra-backend"
              exit 0
            else
              echo "================ CONTAINER LOGS (STARTUP FAILURE) ================"
              docker logs --tail 100 trinetra-backend || true
              echo "=================================================================="
              echo "Health check failed! Rolling back to previous version..."
              docker stop trinetra-backend || true
              docker rm trinetra-backend || true
              
              if [ -n "$OLD_IMAGE" ]; then
                docker run -d \
                  --name trinetra-backend \
                  --restart unless-stopped \
                  -p 8000:8000 \
                  -v /opt/trinetra/data:/app/data \
                  -e APP_DATA_DIR=/app/data \
                  -e APP_CASE_DIR=/app/data/cases \
                  --env-file /opt/trinetra/.env \
                  $OLD_IMAGE
                
                echo "Waiting for rollback container to start..."
                ROLLBACK_HEALTHY=false
                for j in $(seq 1 12); do
                  if curl -s -f http://localhost:8000/health > /dev/null; then
                    ROLLBACK_HEALTHY=true
                    break
                  fi
                  sleep 5
                done
                
                if [ "$ROLLBACK_HEALTHY" = true ]; then
                  echo "Rollback to $OLD_IMAGE completed successfully. Marking deployment as failed."
                else
                  echo "Rollback to $OLD_IMAGE FAILED health check. Service may be down."
                  docker logs --tail 100 trinetra-backend || true
                fi
              else
                echo "No previous image found. Service is down."
              fi
              exit 1
            fi
