name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'investigative_copilot/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/gcp-cloud-run-deploy.yml'
  workflow_dispatch:

concurrency:
  group: gcp-production-deployment
  cancel-in-progress: false

jobs:
  deploy-to-gcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_SECRET == 'true'
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: env.HAS_GCP_SECRET == 'true'
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Mumbai asia-south1)
        if: env.HAS_GCP_SECRET == 'true'
        env:
          HAS_GCP_SECRET: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud run deploy trinetra-backend \
            --source . \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 300 \
            --set-env-vars "APP_DATA_DIR=/app/data,APP_CASE_DIR=/app/data/cases" \
            --execution-environment gen2
